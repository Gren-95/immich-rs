[package]
name = "immich-rs"
# Tracks the version of @immich/cli whose behaviour this rewrite mirrors.
version = "3.4.2"
edition = "2024"
description = "A Rust rewrite of the Immich command line interface"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Gren-95/immich-rs"
keywords = ["immich", "photos", "upload", "self-hosted", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "immich-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
indicatif = "0.18"
notify = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Smaller release binaries: link-time optimisation across all crates, no debug
# symbols.
[profile.release]
lto = true
codegen-units = 1
strip = true
